name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm lockfile
        run: npm audit --package-lock-only --audit-level=high
      - name: Audit pnpm lockfile
        run: npx --yes pnpm@10 audit --audit-level high

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag local-settle-backend:scan .
      - name: Scan dependencies and image for high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: local-settle-backend:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
